name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_profiles_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: career_profiles_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d career_profiles_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Initialize test database with Flyway
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/backend/database/migrations:/flyway/sql:ro" \
            -e FLYWAY_URL="jdbc:postgresql://localhost:5432/career_profiles_test" \
            -e FLYWAY_USER="postgres" \
            -e FLYWAY_PASSWORD="postgres" \
            flyway/flyway:13.12.2 migrate

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q